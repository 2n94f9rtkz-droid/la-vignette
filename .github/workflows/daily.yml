name: La Vignette - episode du jour

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q opencv-python-headless==4.10.0.84 pillow numpy
          cd pipeline && npm install --silent && npx playwright install --with-deps chromium

      - name: Fabrication de l'episode (en reserve)
        env:
          TZ: Europe/Paris
        run: bash pipeline/run_daily.sh

      - name: Sauvegarde (episode + video en reserve)
        run: |
          git config user.name "la-vignette-bot"
          git config user.email "la-vignette-bot@users.noreply.github.com"
          VID=$(ls out/*.mp4 | head -1); NAME=$(basename "$VID")
          git add data/history.json episodes latest.json
          git commit -m "Episode ${NAME%.mp4}"
          git pull --rebase origin main && git push origin HEAD:main
          git fetch origin media && git worktree add /tmp/media origin/media
          cp "$VID" /tmp/media/
          cd /tmp/media
          ls la-vignette-*.mp4 | sort | head -n -15 | xargs -r git rm -q
          git add "$NAME"
          git commit -qm "Video $NAME"
          git push origin HEAD:media
